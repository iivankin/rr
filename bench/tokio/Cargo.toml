[package]
name = "server"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "net", "io-util"] }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
panic = "abort"

# Standalone: not a member of the enclosing rr workspace.
[workspace]
