[package]
name = "server"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
monoio = { version = "=0.2.4", default-features = false, features = ["iouring", "legacy", "sync"] }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
panic = "abort"

# Standalone: not a member of the enclosing rr workspace.
[workspace]
