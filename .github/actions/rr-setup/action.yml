name: rr build tools
description: >-
  The tools that build rr's compiler and rr on a host, the pinned compiler
  source in RR_TEMP/rust, and the rustup toolchain whose Cargo and rustfmt
  rr's checks use. On Linux the job runs in an Ubuntu 20.04 container, for
  glibc 2.31, and already has git.
inputs:
  name:
    description: The distribution's name, such as rr-linux-x86_64
    required: true
runs:
  using: composite
  steps:
    - name: Linux build tools
      if: runner.os == 'Linux'
      shell: bash
      run: |
        DEBIAN_FRONTEND=noninteractive apt-get install -qy build-essential python3 python3-pip \
          curl pkg-config file xz-utils zlib1g-dev make gnupg
        # Ubuntu 20.04's clang 10 miscompiles this LLVM for x86_64: LLVM's
        # own packages of clang 18, for the same old glibc, with its
        # profiling runtime and, on x86_64, BOLT.
        curl -sSf https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor -o /usr/share/keyrings/llvm.gpg
        echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/focal/ llvm-toolchain-focal-18 main" \
          > /etc/apt/sources.list.d/llvm.list
        apt-get update -q
        tools=(clang clang++ ld.lld llvm-ar llvm-ranlib llvm-profdata)
        packages=(clang-18 lld-18 llvm-18 libclang-rt-18-dev)
        if [ "$(uname -m)" = x86_64 ]; then
          tools+=(llvm-bolt merge-fdata)
          packages+=(bolt-18)
        fi
        DEBIAN_FRONTEND=noninteractive apt-get install -qy "${packages[@]}"
        for tool in "${tools[@]}"; do
          ln -sf "/usr/lib/llvm-18/bin/$tool" "/usr/bin/$tool"
        done
        clang --version
        pip3 install -q cmake==3.31.6 ninja==1.13.0
        curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        # LLVM's ThinLTO objects are bitcode: LLVM's own archiver indexes
        # their symbols, which binutils' does not.
        {
          echo CC=clang
          echo CXX=clang++
          echo AR=llvm-ar
          echo RANLIB=llvm-ranlib
        } >> "$GITHUB_ENV"
    - name: macOS build tools
      if: runner.os == 'macOS'
      shell: bash
      run: brew install ninja
    - name: Windows build tools
      if: runner.os == 'Windows'
      shell: bash
      run: |
        python -m pip install -q ninja==1.13.0
        # Git's GNU link (hard links) would stand before Visual Studio's
        # linker on PATH in bash.
        mv /usr/bin/link.exe /usr/bin/gnu-link.exe
    - name: Visual Studio's libraries, SDK and compilers on PATH
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      with:
        arch: ${{ inputs.name == 'rr-windows-aarch64' && 'arm64' || 'x64' }}
    - name: LLVM's clang-cl on Windows, as official Rust builds use
      if: runner.os == 'Windows'
      shell: bash
      run: |
        # clang-cl compiles LLVM for ThinLTO and PGO, which Visual Studio's
        # compiler cannot, and correctly on ARM64, where Visual Studio's
        # miscompiles it. lld-link, llvm-lib and llvm-profdata are beside it.
        if [ "${{ inputs.name }}" = rr-windows-aarch64 ]; then
          installer=LLVM-20.1.3-woa64.exe sum=cadc1d94e107d373000b770cd071f39ef60b2a8415322be0890131da00a2ea29
        else
          installer=LLVM-20.1.3-win64.exe sum=0a18ea761147a7de69d6dd60ef81b70496e5255aec6caff22d45da85188614af
        fi
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/$installer" \
          "https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.3/$installer"
        echo "$sum *$RUNNER_TEMP/$installer" | sha256sum -c
        7z x -o"$RUNNER_TEMP/llvm" "$RUNNER_TEMP/$installer" > /dev/null
        clang="$(cygpath -m "$RUNNER_TEMP/llvm/bin/clang-cl.exe")"
        "$clang" --version
        { echo "CC=$clang"; echo "CXX=$clang"; } >> "$GITHUB_ENV"
    - name: Long paths for the compiler's source
      shell: bash
      run: git config --global core.longpaths true
    - name: Checkout pinned Rust compiler
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: rust-lang/rust
        ref: ${{ env.RUST_COMMIT }}
        path: ci-rust
        persist-credentials: false
    - name: The compiler's source outside rr's, whose checks walk rr's tree
      shell: bash
      run: mv ci-rust "$RR_TEMP/rust"
    - name: Cargo, rustfmt and the library source for developing rr
      shell: bash
      run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,rust-src
