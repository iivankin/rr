name: rr build tools
description: >-
  What builds rr on a host: rustup with the official Rust release of
  rust-toolchain.toml and the components rr builds against (rustc-dev),
  the nightly whose rustfmt formats rr's own code, and the C++ compiler
  that builds libFuzzer. On Linux the job runs in an Ubuntu 20.04
  container, for glibc 2.31, and already has git.
inputs:
  name:
    description: The distribution's name, such as rr-linux-x86_64
    required: true
runs:
  using: composite
  steps:
    - name: Linux build tools
      if: runner.os == 'Linux'
      shell: bash
      run: |
        DEBIAN_FRONTEND=noninteractive apt-get install -qy build-essential python3 curl pkg-config \
          file xz-utils make
        curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: Windows build tools
      if: runner.os == 'Windows'
      shell: bash
      run: |
        # Git's GNU link (hard links) would stand before Visual Studio's
        # linker on PATH in bash.
        mv /usr/bin/link.exe /usr/bin/gnu-link.exe
    - name: Visual Studio's libraries, SDK and compilers on PATH
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      with:
        arch: ${{ inputs.name == 'rr-windows-aarch64' && 'arm64' || 'x64' }}
    - name: The Rust release rr builds on, and the nightly of its rustfmt
      shell: bash
      run: |
        # rust-toolchain.toml names the release and its components; rustup
        # installs them on the first use in this directory.
        rustc -vV
        rustup toolchain install nightly-2026-08-15 --profile minimal --component rustfmt
