name: Build and release rr

# Builds rr for each host on the official Rust release it is built on,
# which rustup installs, with libFuzzer from that release's LLVM; installs
# each into its toolchain there and runs the smoke checks; and on a tag or
# on request publishes them as a GitHub release.
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Tag to publish as a release (empty: build only)'
        required: false
        default: ''
      hosts:
        description: 'Distributions to build, by name, comma-separated (empty: all)'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  hosts:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: The distributions this run builds
        id: pick
        env:
          HOSTS: ${{ inputs.hosts }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os
          all = [
              {'name': 'rr-macos-arm64', 'runner': 'macos-15'},
              {'name': 'rr-linux-x86_64', 'runner': 'ubuntu-24.04', 'container': 'ubuntu:20.04'},
              {'name': 'rr-linux-aarch64', 'runner': 'ubuntu-24.04-arm', 'container': 'ubuntu:20.04'},
              {'name': 'rr-windows-x86_64', 'runner': 'windows-2025'},
              {'name': 'rr-windows-aarch64', 'runner': 'windows-11-arm'},
          ]
          wanted = [h.strip() for h in os.environ.get('HOSTS', '').split(',') if h.strip()]
          chosen = [h for h in all if not wanted or h['name'] in wanted]
          print('matrix=' + json.dumps({'include': chosen}))
          PY

  build:
    needs: hosts
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.hosts.outputs.matrix) }}
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Git, in the Linux container
        if: matrix.container
        run: apt-get update -q && DEBIAN_FRONTEND=noninteractive apt-get install -qy git ca-certificates
      - name: Checkout rr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build tools
        uses: ./.github/actions/rr-setup
        with:
          name: ${{ matrix.name }}
      - name: rr's own checks
        if: runner.os != 'Windows'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/rr-check
          RUSTC_BOOTSTRAP: '1'
        run: cargo test --locked --no-fail-fast -- --skip 5041_allow_dev_build
      - name: Build, package, install and check rr
        run: scripts/release.sh "$RUNNER_TEMP/rr-release" "${{ matrix.name }}"
      - name: Upload the distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: |
            dist/${{ matrix.name }}.tar.gz
            dist/${{ matrix.name }}.zip
            dist/${{ matrix.name }}-verification.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download every distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
        run: |
          cd dist
          sha256sum rr-*.tar.gz rr-*.zip > SHA256SUMS
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "rr $TAG" \
            --notes "rr, Restricted Rust: the checker for macOS arm64, Linux x86_64 and aarch64, Windows x86_64 and aarch64. Each archive holds rr and libFuzzer for the official Rust release it is built on; install.sh and install.ps1 install that release with rustup and put rr into it. See README.md inside." \
            rr-*.tar.gz rr-*.zip SHA256SUMS ./*-verification.txt

  installers:
    needs: release
    uses: ./.github/workflows/rr-install.yml
    with:
      release: ${{ inputs.release || github.ref_name }}
