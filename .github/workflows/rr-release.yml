name: Build and release rr

# Builds the static compiler and rr for each host, verifies each
# distribution, and on a tag publishes them as a GitHub release. Full
# compiler builds run on request or on a tag, not on every push.
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Tag to publish as a release (empty: build only)'
        required: false
        default: ''
      hosts:
        description: 'Distributions to build, by name, comma-separated (empty: all)'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: rr-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUSTUP_TOOLCHAIN: nightly-2026-08-07
  RUST_COMMIT: 84b36a78a28a63f134171c670be1932ffa2485f8

jobs:
  hosts:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: The distributions this run builds
        id: pick
        env:
          HOSTS: ${{ inputs.hosts }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os
          all = [
              {'name': 'rr-macos-arm64', 'runner': 'macos-15'},
              {'name': 'rr-linux-x86_64', 'runner': 'ubuntu-24.04', 'container': 'ubuntu:20.04'},
              {'name': 'rr-linux-aarch64', 'runner': 'ubuntu-24.04-arm', 'container': 'ubuntu:20.04'},
              {'name': 'rr-windows-x86_64', 'runner': 'windows-2025'},
              {'name': 'rr-windows-aarch64', 'runner': 'windows-11-arm'},
          ]
          wanted = [h.strip() for h in os.environ.get('HOSTS', '').split(',') if h.strip()]
          chosen = [h for h in all if not wanted or h['name'] in wanted]
          print('matrix=' + json.dumps({'include': chosen}))
          PY

  build:
    needs: hosts
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.hosts.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Linux build tools, in a glibc 2.31 container for old systems
        if: matrix.container
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -qy build-essential git python3 python3-pip \
            curl pkg-config file xz-utils ca-certificates zlib1g-dev make clang lld
          pip3 install -q cmake==3.31.6 ninja==1.13.0
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo CC=clang >> "$GITHUB_ENV"
          echo CXX=clang++ >> "$GITHUB_ENV"
      - name: macOS build tools
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Windows build tools
        if: runner.os == 'Windows'
        run: python -m pip install -q ninja==1.13.0
      - name: Visual Studio's compilers on PATH
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ matrix.name == 'rr-windows-aarch64' && 'arm64' || 'x64' }}
      - name: Paths that bash and Windows programs both read
        run: |
          echo "RR_TEMP=$( (command -v cygpath >/dev/null && cygpath -m "$RUNNER_TEMP") || echo "$RUNNER_TEMP")" >> "$GITHUB_ENV"
          git config --global core.longpaths true
      - name: Checkout rr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout pinned Rust compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rust-lang/rust
          ref: ${{ env.RUST_COMMIT }}
          path: ci-rust
          persist-credentials: false
      - name: Cargo, rustfmt and the library source for developing rr
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,rust-src
      - name: Build LLVM and the matching static compiler
        run: scripts/build-toolchain.sh "$PWD/ci-rust" "$RR_TEMP/rr-scratch" "$RR_TEMP/rr-toolchain"
      - name: rr's own checks
        if: runner.os != 'Windows'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/rr-check
          # LLVM's ThinLTO objects are bitcode: lld reads them, GNU ld does not.
          RUSTFLAGS: ${{ matrix.container && '-Clink-arg=-fuse-ld=lld' || '' }}
        run: |
          cargo fmt --all --check
          cargo test --locked -- --skip 5041_allow_dev_build
      - name: Build, package and verify the distribution
        run: scripts/release.sh "$PWD/ci-rust" "$RR_TEMP/rr-toolchain" "$RR_TEMP/rr-release" "${{ matrix.name }}"
      - name: Upload the distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: |
            dist/${{ matrix.name }}.tar.gz
            dist/${{ matrix.name }}.zip
            dist/${{ matrix.name }}-verification.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download every distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
        run: |
          cd dist
          sha256sum rr-*.tar.gz rr-*.zip > SHA256SUMS
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "rr $TAG" \
            --notes "rr, Restricted Rust: the compiler and linter for macOS arm64, Linux x86_64 and aarch64, Windows x86_64 and aarch64. Each archive holds rr, its sysroots for the host and for rr's Linux and Windows targets, rust-lld and libFuzzer; see README.md inside." \
            rr-*.tar.gz rr-*.zip SHA256SUMS ./*-verification.txt
