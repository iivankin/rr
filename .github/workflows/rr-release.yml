name: Build and release rr

# Builds the static compiler and rr for each host, verifies each
# distribution, and on a tag publishes them as a GitHub release. Full
# compiler builds run on request or on a tag, not on every push.
#
# The compiler is built as official Rust builds are, with profile-guided
# optimization: `profile` builds it twice, with its Rust half and with its
# C++ half (LLVM) instrumented, and gathers a profile from each at rr's
# kind of work; `toolchain` builds the release compiler with both
# profiles, ThinLTO and one codegen unit per crate; `build` builds rr,
# which BOLT lays out on Linux x86_64, and packages it. Compilers and
# profiles are kept in the cache, so a job whose result is there does
# nothing.
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Tag to publish as a release (empty: build only)'
        required: false
        default: ''
      hosts:
        description: 'Distributions to build, by name, comma-separated (empty: all)'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUSTUP_TOOLCHAIN: nightly-2026-08-15
  RUST_COMMIT: 58cf8f9c35b355199727627d07ae34a4e2846d67

jobs:
  hosts:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      profiles: ${{ steps.pick.outputs.profiles }}
    steps:
      - name: The distributions this run builds
        id: pick
        env:
          HOSTS: ${{ inputs.hosts }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os
          all = [
              {'name': 'rr-macos-arm64', 'runner': 'macos-15'},
              {'name': 'rr-linux-x86_64', 'runner': 'ubuntu-24.04', 'container': 'ubuntu:20.04'},
              {'name': 'rr-linux-aarch64', 'runner': 'ubuntu-24.04-arm', 'container': 'ubuntu:20.04'},
              {'name': 'rr-windows-x86_64', 'runner': 'windows-2025'},
              {'name': 'rr-windows-aarch64', 'runner': 'windows-11-arm'},
          ]
          wanted = [h.strip() for h in os.environ.get('HOSTS', '').split(',') if h.strip()]
          chosen = [h for h in all if not wanted or h['name'] in wanted]
          print('matrix=' + json.dumps({'include': chosen}))
          print('profiles=' + json.dumps({'include': [dict(h, kind=k) for h in chosen for k in ('rustc', 'llvm')]}))
          PY

  profile:
    needs: hosts
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.hosts.outputs.profiles) }}
    name: profile (${{ matrix.name }}, ${{ matrix.kind }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Git, in the Linux container
        if: matrix.container
        run: apt-get update -q && DEBIAN_FRONTEND=noninteractive apt-get install -qy git ca-certificates
      - name: Checkout rr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The compiler's cache key
        id: key
        uses: ./.github/actions/rr-key
        with:
          name: ${{ matrix.name }}
      - name: Whether the release compiler is built
        id: toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.RR_TEMP }}/rr-toolchain
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - name: Whether the profile is gathered
        id: profile
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.RR_TEMP }}/rr-pgo/${{ matrix.kind }}.profdata
          key: rr-pgo-${{ matrix.kind }}-${{ steps.key.outputs.key }}
          lookup-only: true
      - name: Build tools and the compiler's source
        if: steps.toolchain.outputs.cache-hit != 'true' && steps.profile.outputs.cache-hit != 'true'
        uses: ./.github/actions/rr-setup
        with:
          name: ${{ matrix.name }}
      - name: Build the instrumented compiler and gather its profile
        if: steps.toolchain.outputs.cache-hit != 'true' && steps.profile.outputs.cache-hit != 'true'
        run: scripts/pgo-profile.sh "${{ matrix.kind }}" "$RR_TEMP/rust" "$RR_TEMP/rr-scratch" "$RR_TEMP/rr-pgo"
      - name: Keep the profile
        if: steps.toolchain.outputs.cache-hit != 'true' && steps.profile.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.RR_TEMP }}/rr-pgo/${{ matrix.kind }}.profdata
          key: rr-pgo-${{ matrix.kind }}-${{ steps.key.outputs.key }}

  toolchain:
    needs: [hosts, profile]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.hosts.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Git, in the Linux container
        if: matrix.container
        run: apt-get update -q && DEBIAN_FRONTEND=noninteractive apt-get install -qy git ca-certificates
      - name: Checkout rr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The compiler's cache key
        id: key
        uses: ./.github/actions/rr-key
        with:
          name: ${{ matrix.name }}
      - name: Whether the release compiler is built
        id: toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.RR_TEMP }}/rr-toolchain
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - name: Build tools and the compiler's source
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: ./.github/actions/rr-setup
        with:
          name: ${{ matrix.name }}
      - name: The Rust half's profile
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.RR_TEMP }}/rr-pgo/rustc.profdata
          key: rr-pgo-rustc-${{ steps.key.outputs.key }}
          fail-on-cache-miss: true
      - name: LLVM's profile
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.RR_TEMP }}/rr-pgo/llvm.profdata
          key: rr-pgo-llvm-${{ steps.key.outputs.key }}
          fail-on-cache-miss: true
      - name: Build LLVM and the matching static compiler with both profiles
        if: steps.toolchain.outputs.cache-hit != 'true'
        env:
          RR_PGO: use
        run: RR_PGO_DIR="$RR_TEMP/rr-pgo" scripts/build-toolchain.sh "$RR_TEMP/rust" "$RR_TEMP/rr-scratch" "$RR_TEMP/rr-toolchain"
      - name: Keep the compiler
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.RR_TEMP }}/rr-toolchain
          key: ${{ steps.key.outputs.key }}

  build:
    needs: [hosts, toolchain]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.hosts.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Git, in the Linux container
        if: matrix.container
        run: apt-get update -q && DEBIAN_FRONTEND=noninteractive apt-get install -qy git ca-certificates
      - name: Checkout rr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The compiler's cache key
        id: key
        uses: ./.github/actions/rr-key
        with:
          name: ${{ matrix.name }}
      - name: Build tools and the compiler's source
        uses: ./.github/actions/rr-setup
        with:
          name: ${{ matrix.name }}
      - name: The release compiler
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.RR_TEMP }}/rr-toolchain
          key: ${{ steps.key.outputs.key }}
          fail-on-cache-miss: true
      - name: LLVM's source, for libFuzzer
        run: git -C "$RR_TEMP/rust" submodule update --init --depth 1 src/llvm-project
      - name: The compiler on the environment, for rr's checks
        run: |
          {
            echo "RR_TOOLCHAIN=$RR_TEMP/rr-toolchain"
            echo "RUSTC=$RR_TEMP/rr-toolchain/bin/rustc"
            echo "RUSTDOC=$RR_TEMP/rr-toolchain/bin/rustdoc"
            echo "SYSROOT=$RR_TEMP/rr-toolchain"
          } >> "$GITHUB_ENV"
      - name: rr's own checks
        if: runner.os != 'Windows'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/rr-check
          # LLVM's ThinLTO objects are bitcode: lld reads them, GNU ld does not.
          RUSTFLAGS: ${{ matrix.container && '-Clink-arg=-fuse-ld=lld' || '' }}
        run: |
          cargo fmt --all --check
          cargo test --locked --no-fail-fast -- --skip 5041_allow_dev_build
      - name: Build, package and verify the distribution
        run: scripts/release.sh "$RR_TEMP/rust" "$RR_TEMP/rr-toolchain" "$RR_TEMP/rr-release" "${{ matrix.name }}"
      - name: Upload the distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: |
            dist/${{ matrix.name }}.tar.gz
            dist/${{ matrix.name }}.zip
            dist/${{ matrix.name }}-verification.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download every distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
        run: |
          cd dist
          sha256sum rr-*.tar.gz rr-*.zip > SHA256SUMS
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "rr $TAG" \
            --notes "rr, Restricted Rust: the compiler and linter for macOS arm64, Linux x86_64 and aarch64, Windows x86_64 and aarch64. Each archive holds rr, its sysroots for the host and for the host's rr target where there is one, rust-lld and libFuzzer; see README.md inside." \
            rr-*.tar.gz rr-*.zip SHA256SUMS ./*-verification.txt

  installers:
    needs: release
    uses: ./.github/workflows/rr-install.yml
    with:
      release: ${{ inputs.release || github.ref_name }}
