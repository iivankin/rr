name: Registry

# Runs scripts/registry-check.sh on every component of registry/ with the
# published rr, on each host: their code for the CPU and the system
# compiles only where it is checked, and their tests and benches run on
# what the runner has. Each job first says what CPU it is on and what of
# it the components use. A push of any branch that changes them runs it,
# so a change is checked on every host before it reaches main, which rr
# add serves.
on:
  push:
    paths:
      - 'registry/**'
      - 'scripts/registry-check.sh'
      - 'src/rr_cli/add.rs'
      - 'src/rr_cli/component.rs'
      - '.github/workflows/rr-registry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout rr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The CPU
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)
              grep -m1 -E 'model name|CPU part' /proc/cpuinfo || true
              grep -m1 -E '^(flags|Features)' /proc/cpuinfo | tr ' ' '\n' \
                | grep -xE 'aes|pclmulqdq|ssse3|avx2|vaes|vpclmulqdq|sha_ni|pmull|sha2|sha3|sha512' \
                | tr '\n' ' '; echo ;;
            macOS) sysctl -n machdep.cpu.brand_string ;;
            Windows) powershell -NoProfile -Command '(Get-CimInstance Win32_Processor).Name' ;;
          esac
      - name: rr, by install.sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh install.sh < /dev/null
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: rr, by install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path (Get-Command rr).Source)
      - name: rr add of this checkout
        # The components are in the format this checkout's rr add reads
        # (one file each, cut by its options): until a release has it, the
        # checks run on the published rr and the adds on this one, built
        # against the same toolchain, whose libraries it loads from there.
        shell: bash
        run: |
          # Git's GNU link would stand before Visual Studio's linker in bash.
          if [ "$RUNNER_OS" = Windows ]; then mv /usr/bin/link.exe /usr/bin/gnu-link.exe; fi
          RUSTC_BOOTSTRAP=1 CARGO_TARGET_DIR="$RUNNER_TEMP/rr-target" cargo build --locked --release --bin rr
          sysroot=$(rustc --print sysroot | tr -d '\r')
          bin="$RUNNER_TEMP/rr-target/release/rr"
          if [ "$RUNNER_OS" = Windows ]; then sysroot=$(cygpath -u "$sysroot"); bin=$(cygpath -u "$bin"); fi
          {
            echo '#!/bin/sh'
            echo "PATH=\"$sysroot/bin:\$PATH\" LD_LIBRARY_PATH=\"$sysroot/lib\" DYLD_LIBRARY_PATH=\"$sysroot/lib\" exec \"$bin\" \"\$@\""
          } > "$RUNNER_TEMP/rr-add"
          chmod +x "$RUNNER_TEMP/rr-add"
          "$RUNNER_TEMP/rr-add" --version
          echo "RRADD=$(cd "$RUNNER_TEMP" && pwd)/rr-add" >> "$GITHUB_ENV"
      - name: Files a script writes, as it writes them
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          python3 registry/gen/ecdsa-gen.py --check
          python3 registry/gen/rsa-gen.py --check
          cp registry/index.json "$RUNNER_TEMP/index.json"
          "$RRADD" add --index registry
          cmp registry/index.json "$RUNNER_TEMP/index.json"
      - name: Every component, together
        shell: bash
        run: |
          rr --version
          names=$(ls registry/*.rs | sed 's|registry/||; s|\.rs$||')
          scripts/registry-check.sh "$RUNNER_TEMP/registry" $names
      - name: Every component, cut to this system and CPU
        shell: bash
        run: |
          case "$RUNNER_OS" in Linux) os=linux ;; macOS) os=macos ;; Windows) os=windows ;; esac
          case "$(uname -m)" in x86_64|AMD64) arch=x86_64 ;; *) arch=aarch64 ;; esac
          names=$(ls registry/*.rs | sed 's|registry/||; s|\.rs$||')
          OPTIONS="os=$os arch=$arch" scripts/registry-check.sh "$RUNNER_TEMP/registry-cut" $names
      - name: Every component, without its tests
        shell: bash
        run: |
          names=$(ls registry/*.rs | sed 's|registry/||; s|\.rs$||')
          OPTIONS="tests=no" scripts/registry-check.sh "$RUNNER_TEMP/registry-bare" $names
