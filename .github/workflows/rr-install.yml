name: Install rr

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release tag to install (empty: the latest)'
        required: false
        default: ''
  workflow_call:
    inputs:
      release:
        type: string
        required: true

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    env:
      RR_VERSION: ${{ inputs.release }}
    steps:
      - name: Checkout rr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install.sh, twice, then a project built and tested
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh install.sh < /dev/null
          sh install.sh < /dev/null
          "$HOME/.local/bin/rr" --version
          cd "$RUNNER_TEMP"
          "$HOME/.local/bin/rr" init demo
          cd demo
          # rustup's rustc, which takes the project's rust-toolchain.toml.
          PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH" make all test check
          ./demo
      - name: install.ps1, in Windows PowerShell, as from irm
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-Content -Raw install.ps1 | Invoke-Expression
          rr --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: install.ps1 again, in PowerShell, then a project built and tested
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1
          Set-Location $env:RUNNER_TEMP
          rr init demo
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Set-Location demo
          rustc src/main.rs --edition 2024 --crate-name demo -C panic=abort -o demo.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./demo.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          rr test src/main.rs --crate-name demo
          if ($LASTEXITCODE -ne 0) { exit 1 }
          rr check src/main.rs --crate-name demo
          if ($LASTEXITCODE -ne 0) { exit 1 }
