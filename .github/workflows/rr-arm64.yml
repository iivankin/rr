name: Build rr with static driver and ARM64 LLVM

# Full Rust/LLVM rebuilds run manually, rather than on every source push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rr-arm64
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_SPLIT_DEBUGINFO: 'off'
  RUSTUP_TOOLCHAIN: nightly-2026-08-07
  CARGO_BUILD_JOBS: '6'

jobs:
  build:
    runs-on: blacksmith-12vcpu-macos-15
    timeout-minutes: 360
    steps:
      - name: Checkout rr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout pinned Rust compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rust-lang/rust
          ref: 84b36a78a28a63f134171c670be1932ffa2485f8
          path: ci-rust
          persist-credentials: false
      - name: Install Cargo and formatter for developing rr
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt
      - name: Build LLVM and matching static compiler in Actions
        run: scripts/build-toolchain.sh "$PWD/ci-rust" "$RUNNER_TEMP" "$RUNNER_TEMP/rr-toolchain"
      - name: Build rr and upstream lint driver with custom compiler
        # Bootstrap controls compiler LTO through rr-bootstrap.toml. Apply the
        # Cargo release profile only to rr, not to bootstrap's stage0 builds.
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/rr-target" >> "$GITHUB_ENV"
          # The compiler-driver executables embed rustc and LLVM. Link one
          # executable at a time so their ThinLTO memory peaks do not overlap.
          for rr_binary in rr clippy-driver cargo-clippy; do
            CARGO_TARGET_DIR="$RUNNER_TEMP/rr-target" cargo build --locked --release --bin "$rr_binary"
          done
      - name: Formatting and compiler checks
        run: |
          cargo fmt --all --check
          cargo check --locked
      - name: Clippy with custom compiler
        run: '"$CARGO_TARGET_DIR/release/cargo-clippy" clippy --all-targets --all-features -- -D warnings'
      - name: Tests
        # One unchanged upstream fixture uses nix 0.9 with removed libc macOS APIs.
        # Its original failure is documented in verification/summary.txt.
        run: cargo test --locked -- --skip 5041_allow_dev_build
      - name: Package and verify standalone rr
        run: |
          scripts/package-rr.sh "$CARGO_TARGET_DIR/release/rr" "$RR_TOOLCHAIN" dist/rr-macos-arm64
          python3 scripts/verify-arm64-bundle.py dist/rr-macos-arm64 | tee dist/arm64-verification.txt
          python3 scripts/smoke-distribution.py dist/rr-macos-arm64 | tee dist/smoke-verification.txt
          cp .github/rr-bootstrap.toml dist/rr-macos-arm64/bootstrap.toml
          tar -C dist -czf dist/rr-macos-arm64-static-driver.tar.gz rr-macos-arm64
          du -sh dist/rr-macos-arm64 dist/rr-macos-arm64-static-driver.tar.gz
      - name: Upload tested compiler artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rr-macos-arm64-static-driver
          path: |
            dist/rr-macos-arm64-static-driver.tar.gz
            dist/*-verification.txt
          compression-level: 0
          retention-days: 14
      - name: Upload bootstrap diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rr-bootstrap-diagnostics
          path: |
            ci-rust/build/bootstrap/bootstrap.toml
            ci-rust/bootstrap.toml
            ci-rust/build/host/llvm/build/CMakeCache.txt
            ci-rust/build/aarch64-apple-darwin/llvm/build/CMakeCache.txt
          if-no-files-found: ignore
          retention-days: 7
