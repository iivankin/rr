# Rust 1.99 compiler and its private libraries are rebuilt together so rr can
# statically link rustc_driver against the reduced LLVM ABI.
change-id = "ignore"

[build]
# The build, host and target are the machine's own: bootstrap finds it.
# Leave memory and CPU capacity for ThinLTO while compiling dependencies.
jobs = 6
docs = false
compiler-docs = false
extended = false
# ASan is an optional runtime for instrumented fuzz targets, not the compiler.
sanitizers = true

[llvm]
download-ci-llvm = false
thin-lto = true
# The host's own backend only: build-toolchain.sh sets llvm.targets.
# On Linux, rr carries its C++ library, as official rustc does.
static-libstdcpp = true
experimental-targets = ""
link-shared = false
optimize = true
release-debuginfo = false
assertions = false
ninja = true
link-jobs = 1

[rust]
download-rustc = false
channel = "nightly"
optimize = true
debuginfo-level = 0
debug-assertions = false
incremental = false
# Retain bitcode in compiler rlibs for the final statically linked rr ThinLTO.
lto = "thin"
codegen-backends = ["llvm"]
# rust-lld links rr's Linux and Windows targets with no system linker.
lld = true
omit-git-hash = false
rpath = true

[dist]
compression-formats = ["gz"]
compression-profile = "fast"
