# Rust 1.99 compiler and its private libraries are rebuilt together so rr can
# statically link rustc_driver against the reduced LLVM ABI.
change-id = "ignore"

[build]
build = "aarch64-apple-darwin"
host = ["aarch64-apple-darwin"]
target = ["aarch64-apple-darwin"]
# Leave memory and CPU capacity for ThinLTO while compiling dependencies.
jobs = 6
docs = false
compiler-docs = false
extended = false

[llvm]
download-ci-llvm = false
thin-lto = true
targets = "AArch64"
experimental-targets = ""
link-shared = false
optimize = true
release-debuginfo = false
assertions = false
ninja = true
link-jobs = 1

[rust]
download-rustc = false
channel = "nightly"
optimize = true
debuginfo-level = 0
debug-assertions = false
incremental = false
# Retain bitcode in compiler rlibs for the final statically linked rr ThinLTO.
lto = "thin"
codegen-backends = ["llvm"]
omit-git-hash = false
rpath = true

[dist]
compression-formats = ["gz"]
compression-profile = "fast"
